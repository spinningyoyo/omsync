{# Adapted from Sure (we-promise/sure), AGPL-3.0: app/components/DS/select.html.erb and the
   .form-field rules in components.css. Deviation: a native <select> with Sure's field styling,
   not Sure's custom listbox. A custom listbox can come later, with its own controller.

   options: list of {value, label}. selected: the value to show. #}

{% macro select(id, name, options, selected=none, label=none, placeholder=none) -%}
<div class="form-field">
  <div class="form-field__body">
    {%- if label %}
    <label class="form-field__label" for="{{ id }}">{{ label }}</label>
    {%- endif %}
    <select id="{{ id }}" name="{{ name }}" class="form-field__input w-full">
      {%- if placeholder and selected is none %}
      <option value="" selected disabled>{{ placeholder }}</option>
      {%- endif %}
      {%- for option in options %}
      <option value="{{ option.value }}"{% if option.value == selected %} selected{% endif %}>{{ option.label }}</option>
      {%- endfor %}
    </select>
  </div>
</div>
{%- endmacro %}
